- id: smtp-postfix
  protocol: SMTP
  product: Postfix
  priority: 110
  confidence: 0.93
  banner_regex: '(?i)ESMTP\s+Postfix(?:\s+\((?P<os>Ubuntu|Debian)\))?'
  os_hints:
    - value: Ubuntu
      regex: '(?i)Ubuntu'
    - value: Debian
      regex: '(?i)Debian'

