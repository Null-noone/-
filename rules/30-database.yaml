- id: mysql-mariadb
  protocol: MySQL
  product: MariaDB
  priority: 110
  confidence: 0.93
  banner_regex: '(?i)(?:5\.5\.5-)?(?P<version>\d+\.\d+\.\d+)-MariaDB'

- id: mysql-handshake
  protocol: MySQL
  product: MySQL
  priority: 90
  confidence: 0.9
  banner_regex: '(?i)(?:\x00\x00\x00|\x0a|\\x00\\x00\\x00\\n)(?P<version>\d+\.\d+\.\d+)'

- id: mysql-version-port
  protocol: MySQL
  product: MySQL
  priority: 70
  confidence: 0.8
  port_in: [3306, 3307]
  banner_regex: '(?P<version>\d+\.\d+\.\d+)'
  banner_not_contains:
    - MariaDB
    - PostgreSQL
    - FATAL

- id: pgsql-specific
  protocol: PostgreSQL
  product: PostgreSQL
  priority: 100
  confidence: 0.92
  banner_regex: '(?i)SFATAL|pg_hba\.conf|unsupported frontend protocol|password authentication failed for user'

- id: pgsql-fatal-on-pg-port
  protocol: PostgreSQL
  product: PostgreSQL
  priority: 90
  confidence: 0.85
  port_in: [5432, 5433, 15432]
  banner_regex: '(?i)FATAL:'

